[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
interpreter_python = auto_silent
nocows = True
forks = 1
# Patchwork's own vault password. It is not the same file as any other
# vault password on the control node.
vault_password_file = ~/.vault-pass-patchwork
stdout_callback = default
result_format = yaml
