---
# ============================================================================
# vyos.yml: thimble, the VyOS VPN edge, from templates/vyos/<host>.conf.j2.
# ---------------------------------------------------------------------------
# The config lives in the repo as VyOS `set` commands. Secret values (keys,
# RADIUS secrets, password hashes) are not in the file. They are in the vault
# as vault_vyos_<host>, a mapping that the template reads as vyos_secrets.
#
# First time, and after a change made on the router by hand:
#   ansible-playbook vyos.yml -t pull
# This reads `show configuration commands`, writes the template without the
# secrets, and writes the secrets to the vault. It never prints a value.
# Review the template diff, then commit the template and the vault.
#
# Apply the repo to the router (check first):
#   ansible-playbook vyos.yml --check --diff
#   ansible-playbook vyos.yml
#
# vyos_config only ADDS lines that the router does not have. A line removed
# from the template is NOT removed from the router. To remove something, add
# a `delete ...` line to the template, apply, then remove both lines.
# ============================================================================
- name: VyOS edge
  hosts: vyos_edges
  gather_facts: false
  vars:
    vyos_template: "{{ playbook_dir }}/templates/vyos/{{ inventory_hostname }}.conf.j2"
    vyos_vault_key: "vault_vyos_{{ inventory_hostname }}"
  tasks:
    # ------------------------------------------------------------------ pull
    # "| cat" on each config read: the vyos terminal plugin sets
    # "terminal width 512", and without a pipe VyOS puts a space in place of
    # every 512th character of a long line. The pki ca certificates are
    # longer than that, so the read would not match the router.
    - name: Pull | Read the running config
      vyos.vyos.vyos_command:
        commands: show configuration commands | cat
      register: vyos_running
      no_log: true
      tags: [pull, never]

    - name: Pull | Split the secrets out
      ansible.builtin.set_fact:
        vyos_split: "{{ vyos_running.stdout[0] | vyos_split_secrets }}"
      no_log: true
      tags: [pull, never]

    - name: Pull | Write the template (no secrets in it)
      ansible.builtin.copy:
        content: "{{ vyos_split.template }}"
        dest: "{{ vyos_template }}"
        mode: "0644"
      delegate_to: localhost
      tags: [pull, never]

    - name: Pull | Write the secrets to the vault
      ansible.builtin.command:
        argv: ["{{ playbook_dir }}/bin/vault-set", "{{ vyos_vault_key }}", "--object"]
        stdin: "{{ vyos_split.secrets | to_json }}"
      delegate_to: localhost
      changed_when: true
      no_log: true
      tags: [pull, never]

    - name: Pull | Report
      ansible.builtin.debug:
        msg: >-
          Wrote {{ vyos_template | relpath(playbook_dir) }} and
          {{ vyos_split.secrets | length }} secrets to {{ vyos_vault_key }}
          ({{ vyos_split.secrets.keys() | list | join(', ') }}). Review the
          diff, then commit the template here and vault.yml in vault/.
      tags: [pull, never]

    # ----------------------------------------------------------------- apply
    - name: Apply | The template and its secrets exist
      ansible.builtin.assert:
        that:
          - vyos_template is file
          - lookup('ansible.builtin.vars', vyos_vault_key, default=none) is not none
        fail_msg: >-
          No template or no {{ vyos_vault_key }} in the vault. Run
          `ansible-playbook vyos.yml -t pull` first.
        quiet: true

    # Stage 5 of the IKEv2 rollout (README.md, "VPN") sets the input default
    # action to drop. Do it by hand with commit-confirm first. This play then
    # only makes the repo match, and it refuses to be the first to drop.
    - name: Apply | Read the input default action (IKEv2 stage 5)
      vyos.vyos.vyos_command:
        commands: show configuration commands | match "firewall ipv4 input filter default-action"
      register: vyos_input_default
      check_mode: false
      when: vyos_ikev2_stage | default(0) | int >= 5

    - name: Apply | Stage 5 only after the manual commit-confirm
      ansible.builtin.assert:
        that:
          - "'drop' in vyos_input_default.stdout[0]"
        fail_msg: >-
          vyos_ikev2_stage is 5, but thimble does not drop on input yet. Do
          stage 5 by hand with commit-confirm (README.md, "VPN", step 9), then
          run this play again.
        quiet: true
      when: vyos_ikev2_stage | default(0) | int >= 5

    # vyos_config reads the running config without a pipe (see the pull read
    # above), so each long line looks changed and is sent on every run.
    - name: Apply | Read the running config
      vyos.vyos.vyos_command:
        commands: show configuration commands | cat
      register: vyos_running_apply
      check_mode: false
      no_log: true

    - name: Apply | Load the template and commit it
      vyos.vyos.vyos_config:
        src: "{{ vyos_template }}"
        config: "{{ vyos_running_apply.stdout[0] }}"
        save: true
      diff: true
