---
# The secrets that templates/vyos/thimble.conf.j2 reads. vyos.yml -t pull
# writes them to the vault.
vyos_secrets: "{{ vault_vyos_thimble | default({}) }}"
# The IKEv2 VPN rollout stage in templates/vyos/thimble.conf.j2 (0 to 5).
# README.md, "VPN", gives the steps. Raise it one stage at a time, and only
# after the stage before it works on the router.
vyos_ikev2_stage: 0
