# Set to the current release before running. Do not trust this default to be latest.
---
windows_exporter_version: "0.31.7"
windows_exporter_collectors: "cpu,cpu_info,logical_disk,net,os,service,system,memory"
# Release asset URL; split so no line runs past the lint width.
windows_exporter_url: >-
  https://github.com/prometheus-community/windows_exporter/releases/download/v{{ windows_exporter_version
  }}/windows_exporter-{{ windows_exporter_version }}-amd64.msi
