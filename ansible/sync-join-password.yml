---
# ============================================================================
# sync-join-password.yml: AD follows secrets/ad-join.age.
# ---------------------------------------------------------------------------
# The NixOS hosts join AD as svc-lnx-join with the password in
# ../secrets/ad-join.age (agenix). This play makes the AD password of
# svc-lnx-join equal to that file. It is the source of truth.
#
#   1. Decrypt the file on the control node with your SSH key (in memory).
#   2. On the PDC emulator, test the password against AD.
#   3. Set it only if the test fails. A second run changes nothing.
#
# To rotate: `cd secrets && agenix -e ad-join.age`, then run this play.
# Hosts that are already joined keep working: they use their own machine
# account after the join, not svc-lnx-join.
#
#   ansible-playbook sync-join-password.yml
#   ansible-playbook sync-join-password.yml -e age_identity=~/.ssh/other_key
# ============================================================================
- name: Sync the svc-lnx-join password | AD follows secrets/ad-join.age
  hosts: domain_controllers
  gather_facts: false
  vars:
    ad_is_primary_dc: >-
      {{ ansible_host in [ad_dcs[0].ip, ad_dcs[0].name]
         or inventory_hostname == ad_dcs[0].name.split('.')[0] }}
    age_identity: ~/.ssh/id_ed25519
    ad_join_secret_file: "{{ (playbook_dir ~ '/../secrets/ad-join.age') | realpath }}"
  tasks:
    - name: Decrypt secrets/ad-join.age on the control node
      ansible.builtin.command:
        argv:
          - nix
          - --extra-experimental-features
          - nix-command flakes
          - shell
          - nixpkgs#age
          - -c
          - age
          - --decrypt
          - --identity
          - "{{ age_identity | expanduser }}"
          - "{{ ad_join_secret_file }}"
      register: ad_join_secret
      changed_when: false
      delegate_to: localhost
      run_once: true
      no_log: true

    - name: The secret is not empty
      ansible.builtin.assert:
        that: ad_join_secret.stdout | trim | length > 0
        fail_msg: secrets/ad-join.age decrypted to an empty value.
        quiet: true
      run_once: true
      no_log: true

    # One bind attempt. A wrong password adds one to badPwdCount, which is
    # far below any lockout threshold.
    - name: Test the password against AD
      ansible.windows.win_powershell:
        parameters:
          acct: "{{ ad_join_account }}"
          pw: "{{ ad_join_secret.stdout | trim }}"
        script: |
          param([string]$acct, [string]$pw)
          $Ansible.Changed = $false
          Add-Type -AssemblyName System.DirectoryServices.AccountManagement
          $ctx = [System.DirectoryServices.AccountManagement.PrincipalContext]::new('Domain')
          $Ansible.Result = @{ valid = $ctx.ValidateCredentials($acct, $pw, 'Negotiate') }
      register: ad_join_test
      when: ad_is_primary_dc
      no_log: true

    - name: Report
      ansible.builtin.debug:
        msg: >-
          {{ ad_join_account }}: the AD password
          {{ 'already matches secrets/ad-join.age' if ad_join_test.result.valid
             else 'does not match secrets/ad-join.age. Setting it.' }}
      when: ad_is_primary_dc

    # identity, not name: without it the module looks in the default Users
    # container, misses the account and tries to create it.
    - name: Set the AD password to secrets/ad-join.age
      microsoft.ad.user:
        identity: "{{ ad_join_account }}"
        password: "{{ ad_join_secret.stdout | trim }}"
        update_password: always
        state: present
      when:
        - ad_is_primary_dc
        - not ad_join_test.result.valid
      no_log: true
