---
- name: Download Tailscale installer
  ansible.windows.win_get_url:
    url: "{{ tailscale_msi_url }}"
    dest: 'C:\Windows\Temp\tailscale-setup.msi'
    force: false

- name: Install Tailscale
  ansible.windows.win_package:
    path: 'C:\Windows\Temp\tailscale-setup.msi'
    creates_path: 'C:\Program Files\Tailscale\tailscale.exe'
    state: present

# failed_when: false, then decide below. A bare rc=1 here used to abort the
# host with no explanation, and the two ways this probe fails need different
# answers. See the next two tasks.
- name: Check Tailscale login state
  ansible.windows.win_command: '"C:\Program Files\Tailscale\tailscale.exe" status --json'
  register: tailscale_status
  changed_when: false
  failed_when: false

# tailscaled on Windows serves its LocalAPI to ONE user session at a time.
# A session with the Tailscale GUI (tailscale-ipn.exe) open owns it, and every
# other caller, this WinRM session included, gets:
#   401 Unauthorized: Tailscale already in use by <user>, pid <n>
# The service is healthy when this happens. Only the API is taken.
#
# A DISCONNECTED RDP session still holds it, so the console shows nothing wrong.
# On one DC an Administrator session, disconnected for two weeks, still held
# the API through tailscale-ipn. The other DC had no such session and joined
# in the same run.
#
# The role cannot work around this: `tailscale up` below hits the same 401. So
# the host must still fail. It must fail with the cause.
- name: Fail when another session owns the Tailscale API
  ansible.builtin.fail:
    msg: |
      {{ inventory_hostname }} has Tailscale installed and tailscaled running,
      but another Windows session owns the local API, so this run cannot
      configure it:

        {{ tailscale_probe_output | trim }}

      This is a session conflict, NOT a broken install. Do not reinstall.

      Find the owner and release it, from an admin shell on the host:

        quser
        Get-Process tailscale-ipn -IncludeUserName | Select-Object Id,UserName
        Stop-Process -Id <pid> -Force     # GUI returns at the next logon
        logoff <session-id>               # or clear the stale session outright

      Then re-run this play. A disconnected session is the usual cause, so
      check `quser` even when nobody is at the console.
  vars:
    tailscale_probe_output: >-
      {{ (tailscale_status.stderr | default('')) ~ (tailscale_status.stdout | default('')) }}
  when:
    - tailscale_status.rc != 0
    - "'already in use by' in tailscale_probe_output"

- name: Fail when the login state cannot be read
  ansible.builtin.fail:
    msg: |
      `tailscale status --json` failed on {{ inventory_hostname }} with
      rc={{ tailscale_status.rc }}, and the cause is not a session conflict.

        stdout: {{ tailscale_status.stdout | default('') | trim }}
        stderr: {{ tailscale_status.stderr | default('') | trim }}

      Check that the tailscaled service is running before you look anywhere
      else: `Get-Service Tailscale`.
  when: tailscale_status.rc != 0

# Every Patchwork host on the tailnet carries a tag. An untagged node is
# owned by the user who made the auth key, matches autogroup:member, and the
# tailnet policy gives that group much more access (ansible/README.md,
# "Tailscale tags").
- name: Refuse a host with no tag
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} has no tailscale_advertise_tags. Set them in the
      group_vars of its group, or set tailscale_allow_untagged: true for it.
  when:
    - tailscale_advertise_tags | length == 0
    - not (tailscale_allow_untagged | bool)

# With no key, the login below is skipped and the play ends green, but the
# node stays off the tailnet. This happened twice: once with the wrong
# variable name (tailscale_authkey), once with an empty $TSKEY.
- name: Fail when the node needs a login and no auth key is set
  ansible.builtin.fail:
    msg: |
      {{ inventory_hostname }} is not logged in to the tailnet ({{ (tailscale_status.stdout | from_json).BackendState }}),
      and tailscale_auth_key is empty, so this run cannot log it in.

      Give the key with the exact variable name, and check that it is set:

        read -s TSKEY; [ -n "$TSKEY" ] && echo set
        ansible-playbook windows.yml -l {{ inventory_hostname }} -e "tailscale_auth_key=$TSKEY"

      To keep a host off the tailnet, set tailscale_enabled: false for it.
  when:
    - tailscale_auth_key | length == 0
    - (tailscale_status.stdout | from_json).BackendState in ['NeedsLogin', 'NoState']

# --unattended keeps the tunnel up with no user logged in (server mode).
# --accept-dns=false: these boxes ARE the DNS / rely on AD DNS.
# --accept-routes=false: no grant has a Patchwork tag as src, so a route
# through the tailnet would only black-hole traffic that the LAN carries.
# failed_when: false, so the next task can show the error without the key.
- name: Authenticate to tailnet
  ansible.windows.win_command: >-
    "C:\Program Files\Tailscale\tailscale.exe" up
    --auth-key={{ tailscale_auth_key }} --accept-dns=false --accept-routes=false --unattended
    {% if tailscale_advertise_tags | length > 0 %}--advertise-tags={{ tailscale_advertise_tags | join(',') }}{% endif %}
  register: tailscale_up
  failed_when: false
  when:
    - tailscale_auth_key | length > 0
    - (tailscale_status.stdout | from_json).BackendState == 'NeedsLogin'
  no_log: true

- name: Fail when the login failed
  ansible.builtin.fail:
    msg: |
      `tailscale up` failed on {{ inventory_hostname }} (rc={{ tailscale_up.rc }}):

        {{ ((tailscale_up.stderr | default('')) ~ (tailscale_up.stdout | default(''))) | regex_replace('tskey-[A-Za-z0-9_-]+', 'tskey-REDACTED') | trim }}

      "requested tags ... are invalid or not permitted" means one of two things.
      The tag is not in tagOwners of the live tailnet policy yet (merge and
      apply jaspermayone/infra tailscale/policy.hujson first), or the auth key
      does not belong to a tailnet admin.
  when:
    - tailscale_up is not skipped
    - tailscale_up.rc != 0

# Read the state again after a login, so the tag check below also covers a
# node that has just joined.
- name: Read the login state after the login
  ansible.windows.win_command: '"C:\Program Files\Tailscale\tailscale.exe" status --json'
  register: tailscale_status_after
  changed_when: false
  when: tailscale_up is not skipped

# `tailscale up` above runs only at the first login. A node that is already
# logged in keeps the tags it has. So refuse a node whose tags are not the
# wanted tags, and say how to fix it. Any state other than NeedsLogin or
# NoState means the node has an identity (Running, Stopped, Starting,
# NeedsMachineAuth). This does not re-authenticate the node: that would drop
# its sessions.
- name: Fail when a node does not have exactly the wanted tags
  ansible.builtin.fail:
    msg: |
      {{ inventory_hostname }} is on the tailnet with the wrong tags.
      Wanted: {{ tailscale_advertise_tags | join(', ') or 'no tags' }}.
      It has: {{ tailscale_self_tags | join(', ') or 'no tags' }}.

      Tag it from the node, in an admin shell (this re-authenticates it):

        tailscale up --auth-key=<a new auth key> --advertise-tags={{ tailscale_advertise_tags | join(",") }} --force-reauth --unattended --accept-dns=false

      Or in the admin console, Machines, Edit ACL tags. Then run this play again.
  vars:
    tailscale_state: "{{ ((tailscale_status_after if tailscale_status_after is not skipped else tailscale_status).stdout) | from_json }}"
    tailscale_self_tags: "{{ (tailscale_state.Self | default({}, true)).Tags | default([], true) }}"
  when:
    - tailscale_state.BackendState not in ['NeedsLogin', 'NoState']
    - (tailscale_advertise_tags | sort) != (tailscale_self_tags | sort)

# A DC registers the addresses of its adapters in AD DNS. The tailnet address
# must not get there: the lab hosts would then resolve loom to a 100.x
# address that no grant lets them reach. Turn off DNS registration on the
# Tailscale adapter. The adapter is named "Tailscale" by the installer.
- name: The Tailscale adapter does not register in DNS
  ansible.windows.win_powershell:
    script: |
      $Ansible.Changed = $false
      $c = Get-DnsClient -InterfaceAlias 'Tailscale' -ErrorAction SilentlyContinue
      if (-not $c) { $Ansible.Result = 'no Tailscale adapter'; return }
      if ($c.RegisterThisConnectionsAddress) {
        Set-DnsClient -InterfaceAlias 'Tailscale' -RegisterThisConnectionsAddress $false
        $Ansible.Changed = $true
      }

# On a DC the DNS server also listens on every address of the host, the
# tailnet ones included, and it publishes an A and an AAAA record for each
# listening address under its own name. The setting above does not stop
# that. So on a host that runs the DNS server, drop every tailnet address
# (100.64.0.0/10, fd7a:115c:a1e0::/48, and the addresses of the Tailscale
# adapter, its link-local one too) from the listening list.
#
# The list is then explicit: the DNS server does not pick up an address that
# the host gets later. If a DC gets a new LAN address, add it in DNS Manager
# (Properties, Interfaces), or set the list back to all addresses.
#
# One host at a time, because the DNS service restarts. It checks that the
# DC answers on 127.0.0.1 and on its LAN address for up to 60 seconds, and
# puts the old list back if not. ad.yml -t host-dns removes the records that
# were published before.
- name: The DNS server does not listen on tailnet addresses
  ansible.windows.win_powershell:
    parameters:
      domain: "{{ ansible_windows_domain | default('') }}"
    script: |
      param([string]$domain)
      $ErrorActionPreference = 'Stop'
      $Ansible.Changed = $false
      if (-not (Get-Service DNS -ErrorAction SilentlyContinue)) { $Ansible.Result = 'no DNS server'; return }
      if (-not $domain) { $domain = (Get-CimInstance Win32_ComputerSystem).Domain }

      function Bare([string]$a) { ($a -split '%')[0].ToLower() }
      function IsTailnet([string]$a) {
        $b = Bare $a
        if ($b -like 'fd7a:115c:a1e0:*') { return $true }
        if ($b -match '^100\.(\d+)\.') { $o = [int]$Matches[1]; return ($o -ge 64 -and $o -le 127) }
        return $false
      }
      function Answers([string]$server) {
        for ($i = 0; $i -lt 12; $i++) {
          if (Resolve-DnsName -Name $domain -Server $server -DnsOnly -QuickTimeout -ErrorAction SilentlyContinue) { return $true }
          Start-Sleep -Seconds 5
        }
        return $false
      }

      $adapter = @(Get-NetIPAddress -InterfaceAlias 'Tailscale' -ErrorAction SilentlyContinue | ForEach-Object { Bare $_.IPAddress })
      $s = Get-DnsServerSetting -All
      $old = @($s.ListeningIPAddress | ForEach-Object { $_.ToString() })
      $want = @($old | Where-Object { -not (IsTailnet $_) -and ($adapter -notcontains (Bare $_)) })
      if ($want.Count -eq $old.Count) { $Ansible.Result = "not listening on tailnet addresses: $($old -join ', ')"; return }

      $lan = $want | Where-Object { $_ -match '^\d+\.\d+\.\d+\.\d+$' -and $_ -notmatch '^(127|169\.254)\.' } | Select-Object -First 1
      if (-not $lan) { throw "no LAN IPv4 address would be left in the listening list: $($want -join ', ')" }

      try {
        $s.ListeningIPAddress = $want
        Set-DnsServerSetting -InputObject $s
        Restart-Service DNS
        $ok = (Answers '127.0.0.1') -and (Answers $lan)
      } catch {
        $ok = $false
        $err = $_
      }
      if (-not $ok) {
        $s.ListeningIPAddress = $old
        Set-DnsServerSetting -InputObject $s
        Restart-Service DNS
        $back = (Answers '127.0.0.1') -and (Answers $lan)
        throw "DNS did not answer on 127.0.0.1 and $lan after the change ($err). Old list restored; it answers again: $back"
      }
      $Ansible.Changed = $true
      $Ansible.Result = "listening on $($want -join ', ')"
  throttle: 1
