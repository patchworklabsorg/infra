---
# ============================================================================
# Patchwork hosts that Ansible manages: the Windows servers only.
# ---------------------------------------------------------------------------
# The NixOS hosts (warp, skein, seam, hem) are declared in ../flake.nix. They
# join AD through modules/ad-join, not through Ansible. Do not add them here.
# ad.yml -t host-groups reads their names from the flake.
#
# Hosts are pinned by address. The control node does not have to resolve
# patchwork.internal: only loom and spindle are authoritative for it.
# ============================================================================
all:
  children:

    # FUNCTION GROUPS: decide which playbooks and roles apply.
    windows:
      children:
        domain_controllers:
          hosts:
            loom:    { ansible_host: 10.100.90.10 }  # VMID 310  loom.patchwork.internal     PDC emulator
            spindle: { ansible_host: 10.100.90.11 }  # VMID 311  spindle.patchwork.internal  DC
        member_servers:
          hosts:
            bobbin:  { ansible_host: 10.100.90.12 }  # VMID 312  bobbin.patchwork.internal   Issuing CA
            shuttle: { ansible_host: 10.100.90.14 }  # VMID 314  shuttle.patchwork.internal  NPS / RADIUS
        # The Tier 0 jump host (ad/TIERING.md). Terraform creates it
        # (terraform/proxmox/windows.tf). jump-host.yml gives it the admin
        # tools and the RDP shortcuts.
        jump_hosts:
          hosts:
            spool:   { ansible_host: 10.100.90.59 }  # VMID 359  spool.patchwork.internal    Tier 0 jump host

    # The VPN edge. Staff log in with their AD account (RADIUS to NPS on
    # shuttle). Not domain joined. vyos.yml manages its config.
    vyos_edges:
      hosts:
        # VERIFY: 10.100.92.20 is the address thimble sends RADIUS from. It
        # may not be the management address. Confirm before the first pull.
        thimble: { ansible_host: 10.100.92.20 }

    # TENANT GROUP: the forest. group_vars/patchwork.yml holds the realm, the
    # DCs, the OU DNs and the service accounts.
    patchwork:
      children:
        windows: {}

    # ========================================================================
    # NOT managed by Ansible
    #
    #   warp, skein,  NixOS, declared in ../flake.nix. Joined to AD by
    #   seam, hem     modules/ad-join.
    #   pattern       VMID 399. Offline root CA. Stopped. Never a target.
    # ========================================================================
